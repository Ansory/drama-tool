name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'  # Gunakan Node.js 24

    - name: Debug - List files
      run: dir   # Memeriksa apakah file package.json ada

    - name: Install Dependencies
      run: npm install

    - name: Debug - Check package.json scripts
      run: npm run   # Melihat script apa saja yang tersedia

    - name: Build Electron App
      run: npm run build:win

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: DramaTool-Setup
        path: dist/*.exe

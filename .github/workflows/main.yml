name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Drama Tool for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $version = node -e "process.stdout.write(require('./package.json').version)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Cache pip packages
        uses: actions/cache@v4.2.3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # FIX: Cache electron-builder binaries (NSIS, winCodeSign) agar tidak download ulang
      # Ini mencegah error 502 saat GitHub CDN down
      - name: Cache electron-builder binaries
        uses: actions/cache@v4.2.3
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-cache-v1
          restore-keys: |
            ${{ runner.os }}-electron-builder-cache-

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Install NPM Dependencies
        run: npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "backend/requirements.txt") {
            pip install -r backend/requirements.txt
            Write-Host "OK: Python dependencies installed"
          } else {
            Write-Host "WARNING: backend/requirements.txt tidak ditemukan, skip"
          }

      - name: Debug Folder Structure
        run: |
          Write-Host "=== ROOT ==="
          Get-ChildItem -Name
          Write-Host "=== SRC ==="
          if (Test-Path src) { Get-ChildItem src -Recurse -Name | Select-Object -First 50 }
          Write-Host "=== ASSETS ==="
          if (Test-Path assets) { Get-ChildItem assets -Name }
          Write-Host "=== BACKEND ==="
          if (Test-Path backend) { Get-ChildItem backend -Name }

      - name: Generate placeholder assets (jika belum ada)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "Generate placeholder icon.ico..."
            magick -size 256x256 xc:"#1a73e8" -fill white -font Arial -pointsize 96 -gravity center -annotate 0 "DT" assets/temp.png
            magick assets/temp.png -define icon:auto-resize="256,128,64,48,32,16" assets/icon.ico
            Remove-Item assets/temp.png -ErrorAction SilentlyContinue
            Write-Host "OK: icon.ico"
          }

          if (-not (Test-Path "assets/banner.bmp")) {
            Write-Host "Generate placeholder banner.bmp..."
            magick -size 164x314 gradient:"#1a73e8-#0d47a1" -fill white -font Arial -pointsize 18 -gravity center -annotate 0 "DramaTool" assets/banner.bmp
            Write-Host "OK: banner.bmp"
          }

          if (-not (Test-Path "assets/LICENSE.txt")) {
            Write-Host "Generate placeholder LICENSE.txt..."
            $lic = @(
              "MIT License",
              "",
              "Copyright (c) 2026 Ansory",
              "",
              "Permission is hereby granted, free of charge, to any person obtaining a copy",
              "of this software and associated documentation files (the Software), to deal",
              "in the Software without restriction.",
              "",
              "THE SOFTWARE IS PROVIDED AS IS, WITHOUT WARRANTY OF ANY KIND."
            )
            $lic | Set-Content assets/LICENSE.txt -Encoding utf8
            Write-Host "OK: LICENSE.txt"
          }

          Write-Host "Assets siap."

      # FIX: Buat folder backend kosong jika tidak ada di repo
      # Mencegah warning "file source doesn't exist from=backend"
      - name: Ensure backend folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "backend")) {
            New-Item -ItemType Directory -Force -Path backend | Out-Null
            # Buat file placeholder agar folder tidak kosong (git tidak track empty folder)
            "# Backend Python scripts" | Set-Content backend/.gitkeep
            Write-Host "OK: folder backend dibuat"
          } else {
            Write-Host "OK: folder backend sudah ada"
            Get-ChildItem backend -Name
          }

      - name: Generate renderer files (jika belum ada)
        shell: pwsh
        run: |
          if (-not (Test-Path "src/renderer/index.html") -and -not (Test-Path "index.html")) {
            Write-Host "WARNING: index.html tidak ditemukan"
          } else {
            Write-Host "OK: index.html ada"
          }

          if (-not (Test-Path "vite.config.mjs") -and -not (Test-Path "vite.config.js")) {
            Write-Host "WARNING: vite config tidak ditemukan"
          } else {
            Write-Host "OK: vite config ada"
          }

      # FIX: Pisah build Vite dan electron-builder
      # Jika electron-builder gagal karena 502, bisa re-run step ini saja
      - name: Build Renderer (Vite)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # FIX: Tambah retry 3x untuk electron-builder
      # 502 error biasanya transient — retry biasanya sukses
      - name: Build Electron Installer (with retry)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          # FIX: Set custom mirror untuk electron-builder binaries sebagai fallback
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: |
          $maxRetries = 3
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxRetries -and -not $success) {
            $attempt++
            Write-Host "Build attempt $attempt of $maxRetries..."

            npx electron-builder --win --x64 --prepackaged dist/win-unpacked 2>&1
            # Coba build lengkap
            npx electron-builder --win --x64
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Build berhasil pada attempt $attempt"
            } else {
              Write-Host "Build gagal (exit code $LASTEXITCODE)"
              if ($attempt -lt $maxRetries) {
                Write-Host "Menunggu 30 detik sebelum retry..."
                Start-Sleep -Seconds 30
              }
            }
          }

          if (-not $success) {
            Write-Host "ERROR: Build gagal setelah $maxRetries percobaan"
            exit 1
          }

      - name: List Build Output
        run: |
          Write-Host "=== DIST FOLDER ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -Name | Where-Object { $_ -notlike "*win-unpacked*" }
            $exes = Get-ChildItem "dist" -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notlike "*win-unpacked*" }
            if ($exes) {
              foreach ($exe in $exes) {
                Write-Host "Installer: $($exe.Name) - $([math]::Round($exe.Length / 1MB, 2)) MB"
              }
            } else {
              Write-Host "WARNING: Tidak ada .exe installer ditemukan"
            }
          } else {
            Write-Host "ERROR: DIST folder tidak ada!"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DramaTool-Setup-v${{ steps.pkg.outputs.VERSION }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DramaTool-Portable-v${{ steps.pkg.outputs.VERSION }}
          path: dist/win-unpacked/
          if-no-files-found: warn
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: DramaTool v${{ steps.pkg.outputs.VERSION }}
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          body: |
            ## DramaTool v${{ steps.pkg.outputs.VERSION }}

            **Channel:** stable

            ### Cara Install
            1. Download file `DramaTool-Setup-*.exe` di bawah
            2. Jalankan sebagai Administrator
            3. Ikuti petunjuk instalasi

            ### Update Otomatis
            Aplikasi akan mendeteksi update ini otomatis saat startup.

            ### Catatan
            Backend Python sudah ter-bundle, tidak perlu install Python terpisah.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Drama Tool Build Report
            Versi: v${{ steps.pkg.outputs.VERSION }}
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Download dari tab Actions
        continue-on-error: true

      - name: Send Discord Notification
        if: always()
        uses: tsickert/discord-webhook@v5.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            **Drama Tool v${{ steps.pkg.outputs.VERSION }}** - Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Download: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          npm cache clean --force
          pip cache purge

name: Build & Release DramaTool

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Buat sebagai draft release?'
        required: false
        default: 'true'
        type: boolean
      channel:
        description: 'Channel rilis'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:

  # ── JOB 1: Validasi ──────────────────────────────────────────────────────────
  validate:
    name: "\u2705 Validasi Prasyarat"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Cek file kode wajib ada
        run: |
          echo "Mengecek file kode wajib..."
          MISSING=()

          for f in \
            "package.json" \
            "preload.js" \
            "autoUpdater.js" \
            "gemini_load_balancer.py" \
            "DramaTool.nsi" \
            "src/main/main.js"; do
            if [ ! -f "$f" ]; then
              MISSING+=("TIDAK ADA: $f")
            else
              echo "OK: $f"
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "File kode berikut TIDAK DITEMUKAN:"
            printf '%s\n' "${MISSING[@]}"
            exit 1
          fi

          echo "Mengecek assets installer..."
          for f in "assets/installer.ico" "assets/banner.bmp" "assets/LICENSE.txt"; do
            if [ ! -f "$f" ]; then
              echo "WARNING: $f tidak ada - akan dibuat placeholder otomatis"
            else
              echo "OK: $f"
            fi
          done

          echo "Validasi selesai."

      - name: Validasi package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name','version','main','scripts'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('package.json kekurangan field:', missing.join(', '));
              process.exit(1);
            }
            if (!pkg.scripts.build) {
              console.error('package.json tidak punya script build');
              process.exit(1);
            }
            console.log('package.json valid, versi:', pkg.version);
          "

  # ── JOB 2: Build Python Backend ──────────────────────────────────────────────
  build-python:
    name: "Build Python Backend"
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependensi Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller schedule requests
          if (Test-Path "backend/requirements.txt") {
            pip install -r backend/requirements.txt
          }

      - name: Build gemini_load_balancer.py ke .exe
        run: |
          pyinstaller `
            --onefile `
            --name gemini_load_balancer `
            --clean `
            gemini_load_balancer.py

      - name: Verifikasi hasil build Python
        run: |
          if (-not (Test-Path "dist/gemini_load_balancer.exe")) {
            Write-Error "gemini_load_balancer.exe tidak ditemukan"
            exit 1
          }
          $size = (Get-Item "dist/gemini_load_balancer.exe").Length / 1MB
          Write-Host "OK: gemini_load_balancer.exe ($([math]::Round($size, 1)) MB)"

      - name: Upload artifact Python backend
        uses: actions/upload-artifact@v4
        with:
          name: python-backend
          path: dist/gemini_load_balancer.exe
          retention-days: 1

  # ── JOB 3: Build Electron + NSIS ─────────────────────────────────────────────
  build-electron:
    name: "Build Electron + NSIS Installer"
    runs-on: windows-latest
    needs: build-python

    outputs:
      installer_name: ${{ steps.find-installer.outputs.INSTALLER_NAME }}
      installer_path: ${{ steps.find-installer.outputs.INSTALLER_PATH }}
      app_version: ${{ steps.get-version.outputs.VERSION }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependensi Node
        run: npm install

      - name: Download Python backend
        uses: actions/download-artifact@v4
        with:
          name: python-backend
          path: backend/

      - name: Verifikasi backend tersedia untuk NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "backend/gemini_load_balancer.exe")) {
            Write-Error "backend/gemini_load_balancer.exe tidak ditemukan"
            exit 1
          }
          $size = (Get-Item "backend/gemini_load_balancer.exe").Length / 1MB
          Write-Host "OK: backend/gemini_load_balancer.exe ($([math]::Round($size,1)) MB)"

      - name: Ambil versi dari package.json
        id: get-version
        run: |
          $version = node -e "console.log(require('./package.json').version)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versi: $version"

      - name: Generate placeholder assets (jika belum ada di repo)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          if (-not (Test-Path "assets/installer.ico")) {
            Write-Host "Membuat placeholder installer.ico..."
            magick convert -size 256x256 xc:"#1a73e8" -fill white -font Arial -pointsize 96 -gravity center -annotate 0 "DT" assets/temp_icon.png
            magick convert assets/temp_icon.png -define icon:auto-resize="256,128,64,48,32,16" assets/installer.ico
            Remove-Item assets/temp_icon.png -ErrorAction SilentlyContinue
            Write-Host "OK: installer.ico dibuat"
          } else {
            Write-Host "OK: assets/installer.ico sudah ada"
          }

          if (-not (Test-Path "assets/banner.bmp")) {
            Write-Host "Membuat placeholder banner.bmp..."
            magick convert -size 164x314 gradient:"#1a73e8-#0d47a1" -fill white -font Arial -pointsize 18 -gravity center -annotate 0 "DramaTool" assets/banner.bmp
            Write-Host "OK: banner.bmp dibuat (164x314px)"
          } else {
            Write-Host "OK: assets/banner.bmp sudah ada"
          }

          if (-not (Test-Path "assets/LICENSE.txt")) {
            Write-Host "Membuat placeholder LICENSE.txt..."
            $license = @(
              "MIT License",
              "",
              "Copyright (c) 2026 DramaTool Team",
              "",
              "Permission is hereby granted, free of charge, to any person obtaining a copy",
              "of this software and associated documentation files (the Software), to deal",
              "in the Software without restriction, including without limitation the rights",
              "to use, copy, modify, merge, publish, distribute, sublicense, and/or sell",
              "copies of the Software, and to permit persons to whom the Software is",
              "furnished to do so, subject to the following conditions:",
              "",
              "The above copyright notice and this permission notice shall be included in all",
              "copies or substantial portions of the Software.",
              "",
              "THE SOFTWARE IS PROVIDED AS IS, WITHOUT WARRANTY OF ANY KIND, EXPRESS OR",
              "IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,",
              "FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT."
            )
            $license | Set-Content -Path assets/LICENSE.txt -Encoding utf8
            Write-Host "OK: LICENSE.txt dibuat"
          } else {
            Write-Host "OK: assets/LICENSE.txt sudah ada"
          }

      - name: Build React / frontend (Vite)
        run: npm run build

      - name: Build Electron installer Windows (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (opsional - uncomment jika punya sertifikat):
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Cari file installer hasil build
        id: find-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" -Recurse |
            Where-Object { $_.FullName -notlike "*win-unpacked*" } |
            Select-Object -First 1

          if (-not $installer) {
            $installer = Get-ChildItem -Path dist -Filter "*.exe" -Recurse |
              Where-Object { $_.FullName -notlike "*win-unpacked*" } |
              Select-Object -First 1
          }

          if (-not $installer) {
            Write-Error "Tidak ada installer .exe ditemukan di dist/"
            Get-ChildItem -Path dist -Recurse | Select-Object FullName
            exit 1
          }

          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_NAME=$($installer.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "OK: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find-installer.outputs.INSTALLER_PATH }}
          retention-days: 7

      - name: Upload latest.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: dist/latest.yml
          retention-days: 7
        continue-on-error: true

  # ── JOB 4: Publish GitHub Release ────────────────────────────────────────────
  release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: build-electron
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/

      - name: Download update manifest
        uses: actions/download-artifact@v4
        with:
          name: update-manifest
          path: release/
        continue-on-error: true

      - name: Tentukan info rilis
        id: release-info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v${{ needs.build-electron.outputs.app_version }}"
          fi

          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"

          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$CHANNEL" != "stable" ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DRAFT="${{ github.event.inputs.draft || 'true' }}"
          else
            DRAFT="false"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "DRAFT=$DRAFT" >> $GITHUB_OUTPUT
          echo "CHANNEL=$CHANNEL" >> $GITHUB_OUTPUT

          echo "Versi   : $VERSION"
          echo "Channel : $CHANNEL"
          echo "Pre-rel : $PRERELEASE"
          echo "Draft   : $DRAFT"

      - name: Lihat isi folder release
        run: ls -lh release/

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.VERSION }}
          name: "DramaTool ${{ steps.release-info.outputs.VERSION }}"
          draft: ${{ steps.release-info.outputs.DRAFT }}
          prerelease: ${{ steps.release-info.outputs.PRERELEASE }}
          generate_release_notes: true
          body: |
            ## DramaTool ${{ steps.release-info.outputs.VERSION }}

            **Channel:** `${{ steps.release-info.outputs.CHANNEL }}`

            ### Cara Install
            1. Download file `DramaTool-Setup-*.exe` di bawah
            2. Jalankan installer sebagai Administrator
            3. Ikuti petunjuk instalasi

            ### Update Otomatis
            Jika sudah install versi sebelumnya, aplikasi akan mendeteksi update ini otomatis saat startup atau setiap 6 jam sekali.

            ### Gemini Load Balancer
            Backend Python sudah ter-bundle di dalam installer. Tidak perlu install Python terpisah.
          files: |
            release/*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

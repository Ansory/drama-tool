name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Drama Tool for Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4.2.3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "backend/requirements.txt") {
            pip install -r backend/requirements.txt
            Write-Host "OK: Python dependencies installed"
          } else {
            Write-Host "WARNING: backend/requirements.txt tidak ditemukan, skip"
          }

      - name: Debug Folder Structure
        run: |
          Write-Host "=== ROOT ==="
          Get-ChildItem -Name
          Write-Host "=== SRC ==="
          if (Test-Path src) { Get-ChildItem src -Recurse -Name | Select-Object -First 50 }
          Write-Host "=== ASSETS ==="
          if (Test-Path assets) { Get-ChildItem assets -Name }
          Write-Host "=== BACKEND ==="
          if (Test-Path backend) { Get-ChildItem backend -Name }

      - name: Generate placeholder assets (jika belum ada)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "Generate placeholder icon.ico..."
            magick convert -size 256x256 xc:"#1a73e8" -fill white -font Arial -pointsize 96 -gravity center -annotate 0 "DT" assets/temp.png
            magick convert assets/temp.png -define icon:auto-resize="256,128,64,48,32,16" assets/icon.ico
            Remove-Item assets/temp.png -ErrorAction SilentlyContinue
            Write-Host "OK: icon.ico"
          }

          if (-not (Test-Path "assets/banner.bmp")) {
            Write-Host "Generate placeholder banner.bmp..."
            magick convert -size 164x314 gradient:"#1a73e8-#0d47a1" -fill white -font Arial -pointsize 18 -gravity center -annotate 0 "DramaTool" assets/banner.bmp
            Write-Host "OK: banner.bmp"
          }

          if (-not (Test-Path "assets/LICENSE.txt")) {
            Write-Host "Generate placeholder LICENSE.txt..."
            $lic = @(
              "MIT License",
              "",
              "Copyright (c) 2026 Ansory",
              "",
              "Permission is hereby granted, free of charge, to any person obtaining a copy",
              "of this software and associated documentation files (the Software), to deal",
              "in the Software without restriction.",
              "",
              "THE SOFTWARE IS PROVIDED AS IS, WITHOUT WARRANTY OF ANY KIND."
            )
            $lic | Set-Content assets/LICENSE.txt -Encoding utf8
            Write-Host "OK: LICENSE.txt"
          }

          Write-Host "Assets siap."

      - name: Generate renderer files (jika belum ada)
        shell: pwsh
        run: |
          if (-not (Test-Path "src/renderer/index.html") -and -not (Test-Path "index.html")) {
            Write-Host "WARNING: index.html tidak ditemukan"
          } else {
            Write-Host "OK: index.html ada"
          }

          if (-not (Test-Path "vite.config.mjs") -and -not (Test-Path "vite.config.js")) {
            Write-Host "WARNING: vite config tidak ditemukan"
          } else {
            Write-Host "OK: vite config ada"
          }

      - name: Build App (Vite + Electron)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: List Build Output
        run: |
          Write-Host "=== DIST FOLDER ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -Name | Where-Object { $_ -notlike "*win-unpacked*" }
            $exes = Get-ChildItem "dist" -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notlike "*win-unpacked*" }
            if ($exes) {
              foreach ($exe in $exes) {
                Write-Host "Installer: $($exe.Name) - $([math]::Round($exe.Length / 1MB, 2)) MB"
              }
            } else {
              Write-Host "WARNING: Tidak ada .exe installer ditemukan"
            }
          } else {
            Write-Host "ERROR: DIST folder tidak ada!"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DramaTool-Setup
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DramaTool-Portable
          path: dist/win-unpacked/
          if-no-files-found: warn
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: Drama Tool v${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Drama Tool Build Report
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Download dari tab Actions
        continue-on-error: true

      - name: Send Discord Notification
        if: always()
        uses: tsickert/discord-webhook@v5.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            Drama Tool Build - Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Download: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          npm cache clean --force
          pip cache purge

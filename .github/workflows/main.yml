name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      bump_type:
        description: 'Tipe bump versi (hanya berlaku jika create_release=true)'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build DramaTool for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          # Gunakan token agar bisa push commit bump versi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # FIX: Auto-increment versi jika ini adalah release
      # Bump patch (1.0.2 → 1.0.3), minor (1.0.x → 1.1.0), atau major (1.x.x → 2.0.0)
      - name: Bump version & commit
        id: bump
        shell: pwsh
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          $bumpType = "${{ github.event.inputs.bump_type }}"
          if (-not $bumpType) { $bumpType = "patch" }

          # Baca versi sekarang
          $pkg = Get-Content package.json | ConvertFrom-Json
          $current = $pkg.version
          Write-Host "Versi sekarang: $current"

          # Pecah versi
          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          # Bump sesuai tipe
          switch ($bumpType) {
            "major" { $major++; $minor = 0; $patch = 0 }
            "minor" { $minor++; $patch = 0 }
            default  { $patch++ }
          }

          $newVersion = "$major.$minor.$patch"
          Write-Host "Versi baru: $newVersion"

          # Update package.json
          $pkg.version = $newVersion
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8

          # Commit & push
          git add package.json
          git commit -m "chore: bump version to $newVersion [skip ci]"
          git push

          echo "VERSION=$newVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Version bumped: $current → $newVersion"

      # Baca versi dari package.json (untuk non-release build atau setelah bump)
      - name: Read version
        id: pkg
        shell: pwsh
        run: |
          $version = node -e "process.stdout.write(require('./package.json').version)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Cache pip packages
        uses: actions/cache@v4.2.3
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache electron-builder binaries (NSIS, winCodeSign) — cegah error 502
      - name: Cache electron-builder binaries
        uses: actions/cache@v4.2.3
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-eb-cache-v2
          restore-keys: |
            ${{ runner.os }}-eb-cache-

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Install NPM Dependencies
        run: npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "backend/requirements.txt") {
            pip install -r backend/requirements.txt
            Write-Host "OK: Python dependencies installed"
          } else {
            Write-Host "WARNING: backend/requirements.txt tidak ditemukan, skip"
          }

      - name: Ensure backend folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "backend")) {
            New-Item -ItemType Directory -Force -Path backend | Out-Null
            "# Backend Python scripts" | Set-Content backend/.gitkeep
            Write-Host "OK: folder backend dibuat"
          } else {
            Write-Host "OK: folder backend ada"
          }

      - name: Generate placeholder assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "Generate icon.ico..."
            magick -size 256x256 xc:"#1a73e8" -fill white -font Arial -pointsize 96 -gravity center -annotate 0 "DT" assets/temp.png
            magick assets/temp.png -define icon:auto-resize="256,128,64,48,32,16" assets/icon.ico
            Remove-Item assets/temp.png -ErrorAction SilentlyContinue
            Write-Host "OK: icon.ico"
          }

          if (-not (Test-Path "assets/banner.bmp")) {
            magick -size 164x314 gradient:"#1a73e8-#0d47a1" -fill white -font Arial -pointsize 18 -gravity center -annotate 0 "DramaTool" assets/banner.bmp
            Write-Host "OK: banner.bmp"
          }

          if (-not (Test-Path "assets/LICENSE.txt")) {
            @("MIT License","","Copyright (c) 2026 Ansory","","Permission is hereby granted, free of charge, to any person obtaining a copy","of this software and associated documentation files (the Software), to deal","in the Software without restriction.","","THE SOFTWARE IS PROVIDED AS IS, WITHOUT WARRANTY OF ANY KIND.") | Set-Content assets/LICENSE.txt -Encoding utf8
            Write-Host "OK: LICENSE.txt"
          }

      - name: Build Renderer (Vite)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Retry 3x untuk cegah error 502 saat download NSIS
      - name: Build Electron Installer (with retry)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          $maxRetries = 3
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxRetries -and -not $success) {
            $attempt++
            Write-Host "Build attempt $attempt of $maxRetries..."
            npx electron-builder --win --x64
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "Build berhasil pada attempt $attempt"
            } else {
              Write-Host "Build gagal (exit $LASTEXITCODE)"
              if ($attempt -lt $maxRetries) {
                Write-Host "Tunggu 30 detik sebelum retry..."
                Start-Sleep -Seconds 30
              }
            }
          }

          if (-not $success) {
            Write-Host "ERROR: Build gagal setelah $maxRetries percobaan"
            exit 1
          }

      - name: List Build Output
        run: |
          Write-Host "=== DIST ==="
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -Name | Where-Object { $_ -notlike "*win-unpacked*" }
            $exes = Get-ChildItem "dist" -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notlike "*win-unpacked*" }
            foreach ($exe in $exes) {
              Write-Host "Installer: $($exe.Name) — $([math]::Round($exe.Length/1MB,2)) MB"
            }
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DramaTool-Setup-v${{ steps.pkg.outputs.VERSION }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DramaTool-Portable-v${{ steps.pkg.outputs.VERSION }}
          path: dist/win-unpacked/
          if-no-files-found: warn
          retention-days: 7

      # FIX: prerelease: false + make_latest: true — wajib agar electron-updater detect
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: DramaTool v${{ steps.pkg.outputs.VERSION }}
          tag_name: v${{ steps.pkg.outputs.VERSION }}
          body: |
            ## DramaTool v${{ steps.pkg.outputs.VERSION }}

            **Channel:** stable

            ### Cara Install
            1. Download `DramaTool-Setup-${{ steps.pkg.outputs.VERSION }}.exe`
            2. Jalankan sebagai Administrator
            3. Ikuti petunjuk instalasi

            ### Update Otomatis
            Jika sudah install versi sebelumnya, aplikasi akan mendeteksi update ini otomatis saat startup.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            DramaTool Build
            Versi: v${{ steps.pkg.outputs.VERSION }}
            Status: ${{ job.status }}
            Download: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Send Discord Notification
        if: always()
        uses: tsickert/discord-webhook@v5.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            **DramaTool v${{ steps.pkg.outputs.VERSION }}** — ${{ job.status }}
            Download: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          npm cache clean --force
          pip cache purge

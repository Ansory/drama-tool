name: Build & Release DramaTool

on:
  push:
    tags:
      - 'v*.*.*'          # Otomatis trigger saat push tag: v1.0.0, v1.2.3-beta, dll
  workflow_dispatch:       # Bisa dijalankan manual dari tab Actions
    inputs:
      draft:
        description: 'Buat sebagai draft release?'
        required: false
        default: 'true'
        type: boolean
      channel:
        description: 'Channel rilis'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev

permissions:
  contents: write          # Wajib untuk membuat GitHub Release & upload asset

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Validasi — cek semua prasyarat sebelum build dimulai
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: ✅ Validasi Prasyarat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Cek file wajib ada
        run: |
          echo "Mengecek file wajib..."
          MISSING=()

          for f in \
            "package.json" \
            "preload.js" \
            "autoUpdater.js" \
            "gemini_load_balancer.py" \
            "DramaTool.nsi" \
            "src/main/main.js" \
            "assets/installer.ico" \
            "assets/banner.bmp" \
            "assets/LICENSE.txt"; do
            if [ ! -f "$f" ]; then
              MISSING+=("❌ $f")
            else
              echo "✅ $f"
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "File berikut TIDAK DITEMUKAN:"
            printf '%s\n' "${MISSING[@]}"
            echo "Baca README.md untuk panduan lengkap."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          echo "✅ Semua file wajib ditemukan."

      - name: Validasi package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name','version','main','scripts'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('package.json kekurangan field:', missing.join(', '));
              process.exit(1);
            }
            if (!pkg.scripts.build) {
              console.error('package.json tidak punya script build');
              process.exit(1);
            }
            console.log('✅ package.json valid, versi:', pkg.version);
          "

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Python backend (gemini_load_balancer → .exe)
  # ─────────────────────────────────────────────────────────────────────────────
  build-python:
    name: 🐍 Build Python Backend
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependensi Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller schedule requests
          if (Test-Path "backend/requirements.txt") {
            pip install -r backend/requirements.txt
            Write-Host "✅ requirements.txt diinstall"
          } else {
            Write-Host "⚠️  backend/requirements.txt tidak ada, dilewati"
          }

      - name: Build gemini_load_balancer.py ke .exe
        run: |
          pyinstaller `
            --onefile `
            --name gemini_load_balancer `
            --clean `
            gemini_load_balancer.py
          Write-Host "✅ Build Python selesai"

      - name: Verifikasi hasil build Python
        run: |
          if (-not (Test-Path "dist/gemini_load_balancer.exe")) {
            Write-Error "❌ gemini_load_balancer.exe tidak ditemukan"
            exit 1
          }
          $size = (Get-Item "dist/gemini_load_balancer.exe").Length / 1MB
          Write-Host "✅ gemini_load_balancer.exe ($([math]::Round($size, 1)) MB)"

      - name: Upload artifact Python backend
        uses: actions/upload-artifact@v4
        with:
          name: python-backend
          path: dist/gemini_load_balancer.exe
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build Electron app + NSIS installer
  # ─────────────────────────────────────────────────────────────────────────────
  build-electron:
    name: ⚡ Build Electron + NSIS Installer
    runs-on: windows-latest
    needs: build-python

    outputs:
      installer_name: ${{ steps.find-installer.outputs.INSTALLER_NAME }}
      installer_path: ${{ steps.find-installer.outputs.INSTALLER_PATH }}
      app_version:    ${{ steps.get-version.outputs.VERSION }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependensi Node
        run: npm ci

      - name: Download Python backend dari job sebelumnya
        uses: actions/download-artifact@v4
        with:
          name: python-backend
          path: backend/

      - name: Ambil versi dari package.json
        id: get-version
        run: |
          $version = node -e "console.log(require('./package.json').version)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versi: $version"

      - name: Build React / frontend (Vite)
        run: |
          npm run build
          Write-Host "✅ Vite build selesai"

      - name: Build Electron installer Windows (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untuk code signing (opsional):
          # CSC_LINK:         ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run build:win
          Write-Host "✅ Electron NSIS build selesai"

      - name: Cari file installer hasil build
        id: find-installer
        shell: pwsh
        run: |
          # Cari *Setup*.exe di dist, abaikan win-unpacked
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" -Recurse |
            Where-Object { $_.FullName -notlike "*win-unpacked*" } |
            Select-Object -First 1

          if (-not $installer) {
            $installer = Get-ChildItem -Path dist -Filter "*.exe" -Recurse |
              Where-Object { $_.FullName -notlike "*win-unpacked*" } |
              Select-Object -First 1
          }

          if (-not $installer) {
            Write-Error "❌ Tidak ada installer .exe ditemukan di dist/"
            Get-ChildItem -Path dist -Recurse | Select-Object FullName
            exit 1
          }

          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_NAME=$($installer.Name)"     >> $env:GITHUB_OUTPUT
          Write-Host "✅ Installer: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find-installer.outputs.INSTALLER_PATH }}
          retention-days: 7

      # latest.yml dihasilkan electron-builder, dipakai oleh electron-updater
      # untuk mendeteksi versi terbaru (sesuai arsitektur auto-update di repo)
      - name: Upload latest.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: dist/latest.yml
          retention-days: 7
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Publish GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-electron
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/

      - name: Download update manifest (latest.yml)
        uses: actions/download-artifact@v4
        with:
          name: update-manifest
          path: release/
        continue-on-error: true

      - name: Tentukan info rilis
        id: release-info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v${{ needs.build-electron.outputs.app_version }}"
          fi

          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"

          if [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"dev"* ]] || [[ "$CHANNEL" != "stable" ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DRAFT="${{ github.event.inputs.draft || 'true' }}"
          else
            DRAFT="false"
          fi

          echo "VERSION=$VERSION"       >> $GITHUB_OUTPUT
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "DRAFT=$DRAFT"           >> $GITHUB_OUTPUT
          echo "CHANNEL=$CHANNEL"       >> $GITHUB_OUTPUT

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Versi   : $VERSION"
          echo "Channel : $CHANNEL"
          echo "Pre-rel : $PRERELEASE"
          echo "Draft   : $DRAFT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Lihat isi folder release
        run: ls -lh release/

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ steps.release-info.outputs.VERSION }}
          name:                   "DramaTool ${{ steps.release-info.outputs.VERSION }}"
          draft:                  ${{ steps.release-info.outputs.DRAFT }}
          prerelease:             ${{ steps.release-info.outputs.PRERELEASE }}
          generate_release_notes: true
          body: |
            ## DramaTool ${{ steps.release-info.outputs.VERSION }}

            **Channel:** `${{ steps.release-info.outputs.CHANNEL }}`

            ### 📥 Cara Install
            1. Download file `DramaTool-Setup-*.exe` di bawah
            2. Jalankan installer sebagai Administrator
            3. Ikuti petunjuk instalasi

            ### 🔄 Update Otomatis
            Jika sudah install versi sebelumnya, aplikasi akan mendeteksi update ini otomatis saat startup atau setiap 6 jam sekali.

            ### 🐍 Gemini Load Balancer
            Backend Python sudah ter-bundle di dalam installer. Tidak perlu install Python terpisah.

            ---
            > Lihat perubahan lengkap di bagian **Changes** di bawah.
          files: |
            release/*.exe
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release DramaTool

on:
  push:
    tags:
      - 'v*.*.*'        # Trigger saat push tag seperti v1.0.0
  workflow_dispatch:    # Bisa dijalankan manual dari GitHub Actions tab
    inputs:
      draft:
        description: 'Buat sebagai draft release?'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write       # Diperlukan untuk membuat GitHub Release

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Python backend (gemini_load_balancer)
  # ─────────────────────────────────────────────────────────────────────────
  build-python:
    name: 🐍 Build Python Backend
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependensi Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller schedule requests
          if (Test-Path "backend/requirements.txt") {
            pip install -r backend/requirements.txt
          }

      - name: Build gemini_load_balancer menjadi .exe
        run: |
          pyinstaller --onefile --name gemini_load_balancer gemini_load_balancer.py

      - name: Upload Python build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-backend
          path: dist/gemini_load_balancer.exe
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Electron app + NSIS installer
  # ─────────────────────────────────────────────────────────────────────────
  build-electron:
    name: ⚡ Build Electron App
    runs-on: windows-latest
    needs: build-python

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependensi Node
        run: npm ci

      - name: Download Python backend dari job sebelumnya
        uses: actions/download-artifact@v4
        with:
          name: python-backend
          path: backend/

      - name: Cek asset installer wajib
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Test-Path "assets/installer.ico")) { $missing += "assets/installer.ico" }
          if (-not (Test-Path "assets/banner.bmp"))    { $missing += "assets/banner.bmp" }
          if (-not (Test-Path "assets/LICENSE.txt"))   { $missing += "assets/LICENSE.txt" }
          if ($missing.Count -gt 0) {
            Write-Error "❌ File installer berikut tidak ditemukan:`n$($missing -join "`n")`nBaca README.md untuk panduan."
            exit 1
          }
          Write-Host "✅ Semua asset installer ditemukan."

      - name: Build React (Vite)
        run: npm run build

      - name: Build Electron installer (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: Cari file installer hasil build
        id: find-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "❌ Tidak ada file .exe ditemukan di folder dist/"
            exit 1
          }
          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "INSTALLER_NAME=$($installer.Name)"     >> $env:GITHUB_OUTPUT
          Write-Host "✅ Installer ditemukan: $($installer.Name)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find-installer.outputs.INSTALLER_PATH }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Buat GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-electron
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Download installer dari job sebelumnya
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/

      - name: Ambil nama tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          name: "DramaTool ${{ steps.tag.outputs.VERSION }}"
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ contains(steps.tag.outputs.VERSION, 'beta') || contains(steps.tag.outputs.VERSION, 'dev') }}
          generate_release_notes: true
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
